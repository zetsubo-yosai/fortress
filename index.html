<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>絶望要塞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Roboto+Condensed:wght@700&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--c:#fff6d4;--u:.33px;--Hd:2000;--by:700;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--c);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;font-weight:300;overflow:hidden}
#menu{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:#000;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#stage{position:relative;width:calc(var(--u)*1170);height:calc(var(--u)*var(--Hd));flex:none}
#art{position:absolute;inset:0;width:100%;height:100%}
.head{position:absolute;left:0;width:100%;top:20%;transform:translateY(-50%);text-align:center}
.head img{display:block;width:calc(var(--u)*800);height:auto;margin:0 auto}
.sb{margin:calc(var(--u)*40) 0 0;color:var(--c);font-family:Jost,sans-serif;font-weight:300;font-size:calc(var(--u)*40);letter-spacing:calc(var(--u)*18);padding-left:calc(var(--u)*18)}
/* ステージ選択の枠(枠線そのものはSVGで描く。ここは中身の配置) */
.list{position:absolute;left:calc(var(--u)*150);top:calc(var(--u)*var(--by));width:calc(var(--u)*870);height:calc(var(--u)*1010);
  padding:0;display:flex;flex-direction:column;gap:calc(var(--u)*100)}
.row{display:flex;align-items:center;gap:calc(var(--u)*30);width:100%;height:calc(var(--u)*270);margin:0;padding:0 calc(var(--u)*36);flex:none;
  background:transparent;border:0;border-radius:0;color:#fff;font:inherit;font-size:calc(var(--u)*66);font-weight:400;letter-spacing:calc(var(--u)*5);
  cursor:pointer;touch-action:manipulation;transition:background .12s;text-align:left}
.row:active{background:#0a0d14}
.row:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.th{flex:none;width:calc(var(--u)*200);height:calc(var(--u)*200);border:calc(var(--u)*3) solid var(--c);background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.th img{width:100%;height:100%;object-fit:contain;display:block}
.mid{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*18)}
.tt{white-space:nowrap;line-height:1}
.bd{width:calc(var(--u)*96);height:calc(var(--u)*96);flex:none;display:block;overflow:visible}

#game{position:fixed;inset:0;background:#000;display:none;z-index:10}
#game.on{display:block}
#game iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:block}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
</style>
</head>

;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10.5vh);display:none;justify-content:center;gap:14px;flex-wrap:wrap}\n.nm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:300 calc(var(--sz)*.32) \"Oswald\",sans-serif;z-index:1;pointer-events:none}\n#hm{position:absolute;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 5.6vh);background:none;color:var(--ln);border:0;padding:5px 16px;font:400 12px \"Hiragino Kaku Gothic ProN\",\"Noto Sans JP\",\"Yu Gothic\",sans-serif;letter-spacing:.2em;text-indent:.2em;white-space:nowrap;opacity:.85;cursor:pointer;touch-action:manipulation}\n#hm:active{opacity:1}\n*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}\n\u003c/style>\u003c/head>\u003cbody>\n\n\u003cdiv class=\"scr on\" id=\"start\">\u003cdiv class=\"deco\">\u003c/div>\n\u003ch1>\u003cspan id=\"bgG\">\u003c/span>\u003cspan class=\"tt\">一筆書き\u003c/span>\u003cspan id=\"bgH\">\u003c/span>\u003c/h1>\n\u003cdiv class=\"rule\">◇ RULE ◇\u003c/div>\n\u003cul>\u003cli>スタートから一筆書きで、\u003cbr>すべてのマスをなぞれ。\u003c/li>\u003cli>一度なぞったマスの上は\u003cbr>なぞれない。\u003c/li>\u003cli>指を離すと最初に戻る。\u003c/li>\u003c/ul>\n\u003cdiv class=\"row\">\u003cbutton class=\"btn\" id=\"go\">スタート\u003c/button>\u003cdiv class=\"cd\">ゲーム開始まで\u003ci id=\"cd\">10\u003c/i>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"scr\" id=\"game\">\u003cdiv class=\"deco\">\u003c/div>\n\u003cdiv class=\"hud\">\u003cdiv>\u003cspan>STEP\u003c/span>\u003cb id=\"st\">1\u003c/b>\u003csmall>/5\u003c/small>\u003c/div>\u003cdiv>\u003cspan>◇ SCORE\u003c/span>\u003cb id=\"sc\">000\u003c/b>\u003csmall>/100\u003c/small>\u003c/div>\u003cdiv>\u003cspan>◇ TIMER\u003c/span>\u003cb id=\"tm\">120.00\u003c/b>\u003c/div>\u003c/div>\n\u003cdiv id=\"wrap\">\u003csvg id=\"bf\">\u003c/svg>\u003cdiv id=\"board\">\u003c/div>\n\u003cdiv id=\"great\">\u003csvg viewBox=\"0 0 364 100\" fill=\"none\" stroke=\"#fff\" stroke-width=\"5.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"overflow:visible\">\n\u003cpath d=\"M43 30V19Q43 7 31 7H19Q7 7 7 19V81Q7 93 19 93H31Q43 93 43 81V54H26\"/>\n\u003cpath d=\"M87 93V7H111Q125 7 125 21V37Q125 51 111 51H87M108 51L125 93\"/>\n\u003cpath d=\"M201 7H176V93H201M176 50H192\"/>\n\u003cpath d=\"M246 93L258 7H268L280 93M251 66H275\"/>\n\u003cpath d=\"M320 7H364M342 7V100\"/>\n\u003c/svg>\u003c/div>\u003c/div>\n\u003cdiv class=\"hint\">指でなぞれ\u003c/div>\u003cdiv id=\"sol\">\u003cbutton class=\"sbtn\" id=\"rt\">同じ問題にもう一度挑戦\u003c/button>\u003cbutton class=\"sbtn\" id=\"bk\">結果へ戻る\u003c/button>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"scr\" id=\"end\">\u003cdiv class=\"deco\">\u003c/div>\n\u003cdiv class=\"p rt cond\">❋\u003cspan id=\"et\">RESULT\u003c/span>❋\u003c/div>\n\u003cdiv class=\"p rs cond\">\u003cspan id=\"es\">0\u003c/span>\u003csmall>/100\u003c/small>\u003c/div>\n\u003cdiv class=\"p rl cond\" id=\"em\">COMPLETE\u003c/div>\n\u003cdiv class=\"p\" id=\"vs\" style=\"display:none\">\u003cbutton class=\"sbtn\" id=\"vb\">解答を見る\u003c/button>\u003c/div>\n\u003cdiv class=\"p tap\">\u003cbutton class=\"sbtn\" id=\"ag\" type=\"button\">もう一度\u003c/button>\u003c/div>\u003c/div>\n\n\u003cbutton id=\"hm\" type=\"button\">ホームに戻る\u003c/button>\n\u003cscript>\nconst $=id=>document.getElementById(id);\nconst LN='#fcf4dd';\n// 難易度: 縦×横, マス数\nconst LV=[[5,5,17],[5,6,20],[6,6,24],[6,7,28],[7,7,33]];\nlet step,score,tLeft,tLast,running=false,path,cells,vis,head,total,cur,lock=false,rafId,cdT,n,last=null,drawing=false,endReady=0;\n\n/* ---------- 枠デザイン(写真 1170 幅を基準に計測した座標) ---------- */\n// 画面全体の枠: 外枠 + 面取りの飾り角 + 段付きの内枠 + 菱形ドット列\nfunction frameScreen(Wd,Hd,col){\n  const xo=31.5,yo=26,so=6,sd=5,si=4.5;\n  const ue=Wd/2-152-xo,ve=412;\n  const corner=\n    `\u003cpath d=\"M${ue} 0H0V${ve}\" stroke-width=\"${so}\" stroke-linecap=\"round\"/>`+\n    `\u003cpath d=\"M26 0V26H0M49 0V52M0 52H49M49 30H108.5M30 52V108.5M49 52L67.75 70.75M0 138.5L138.5 0\" stroke-width=\"${sd}\"/>`+\n    `\u003cpolygon points=\"74,75.5 90,80.5 95,96.5 78,91.5\" fill=\"${col}\" stroke-width=\"1.2\" stroke-linejoin=\"round\"/>`;\n  const g=(x,y,sx,sy)=>`\u003cg transform=\"translate(${x} ${y}) scale(${sx} ${sy})\">${corner}\u003c/g>`;\n  let o=g(xo,yo,1,1)+g(Wd-xo,yo,-1,1)+g(xo,Hd-yo,1,-1)+g(Wd-xo,Hd-yo,-1,-1);\n  // 内枠\n  const P=(sx,sy,u,v)=>[sx>0?xo+u:Wd-xo-u,sy>0?yo+v:Hd-yo-v];\n  const A=[[30,143.5],[64,109.5],[109.5,109.5],[109.5,65],[143.5,30]],Rv=A.slice().reverse();\n  const pts=[...A.map(p=>P(1,1,...p)),...Rv.map(p=>P(-1,1,...p)),...A.map(p=>P(-1,-1,...p)),...Rv.map(p=>P(1,-1,...p))];\n  o+=`\u003cpath d=\"M${pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')}Z\" stroke-width=\"${si}\"/>`;\n  // 菱形\n  const dia=(x,y,hx,hy)=>`\u003cpolygon points=\"${x},${y-hy} ${x+hx},${y} ${x},${y+hy} ${x-hx},${y}\" fill=\"${col}\" stroke-width=\"1.2\" stroke-linejoin=\"round\"/>`;\n  for(let i=0;i\u003c6;i++){const x=Wd/2+(i-2.5)*43.7;o+=dia(x,yo,5,9.5)+dia(x,Hd-yo,5,9.5)}\n  const y0=yo+447,y1=Hd-yo-447;\n  if(y1>y0){\n    const m=Math.max(2,Math.round((y1-y0)/43.4)+1),pt=(y1-y0)/(m-1);\n    for(let i=0;i\u003cm;i++){const y=y0+pt*i;o+=dia(xo,y,9.5,5)+dia(Wd-xo,y,9.5,5)}\n  }\n  return o;\n}\nfunction buildFrames(){\n  document.querySelectorAll('.scr.on .deco').forEach(d=>{\n    const W=d.clientWidth,H=d.clientHeight;if(!W||!H)return;\n    const k=Math.min(W/1170,H/1400),Wd=W/k,Hd=H/k;\n    d.parentElement.style.setProperty('--k',k);const col=d.parentElement.id==='end'?'#f0edda':LN;\n    d.innerHTML=`\u003csvg width=\"${W}\" height=\"${H}\" viewBox=\"0 0 ${Wd} ${Hd}\" fill=\"none\" stroke=\"${col}\" stroke-linejoin=\"miter\">${frameScreen(Wd,Hd,col)}\u003c/svg>`;\n  });\n}\n// 盤面の枠: 四隅の二重四角 + 三本線 + 白い内枠 (マス 125.5 単位)\nconst BU=125.5,BM=57;\nfunction frameBoard(C,R){\n  const Gw=C*BU,Gh=R*BU,L=BM-2,T=BM-2,Rr=BM+Gw+2,B=BM+Gh+2,c=30.25;\n  let o=`\u003crect x=\"${L}\" y=\"${T}\" width=\"${Rr-L}\" height=\"${B-T}\" stroke=\"#fff\" stroke-width=\"3\"/>`;\n  const sq=(cx,cy)=>`\u003crect x=\"${cx-22.75}\" y=\"${cy-22.75}\" width=\"45.5\" height=\"45.5\"/>\u003crect x=\"${cx-10.25}\" y=\"${cy-10.25}\" width=\"20.5\" height=\"20.5\"/>`;\n  o+=sq(L-c,T-c)+sq(Rr+c,T-c)+sq(L-c,B+c)+sq(Rr+c,B+c);\n  let d='';\n  // 横線(上・下)\n  for(const y of [T-40,B+40])d+=`M${L+8.5} ${y}H${Rr-8.5}`;\n  for(const y of [T-c,B+c])d+=`M${L-7.5} ${y}H${Rr+7.5}`;\n  for(const y of [T-20,B+20])d+=`M${L-40} ${y}H${Rr+40}`;\n  for(const x of [L+8.5,Rr-8.5]){d+=`M${x} ${T-40}V${T-20}M${x} ${B+20}V${B+40}`}\n  // 縦線(左・右)\n  for(const x of [L-40,Rr+40])d+=`M${x} ${T+4}V${B-4}`;\n  for(const x of [L-c,Rr+c])d+=`M${x} ${T-7.5}V${B+7.5}`;\n  for(const x of [L-20,Rr+20])d+=`M${x} ${T-40}V${B+40}`;\n  for(const y of [T+4,B-4]){d+=`M${L-40} ${y}H${L-20}M${Rr+20} ${y}H${Rr+40}`}\n  o+=`\u003cpath d=\"${d}\"/>`;\n  return {vbW:Gw+2*BM,vbH:Gh+2*BM,svg:o};\n}\n\n// 放射状の菱形バッジ(G / H): ステージ選択・旗あげと同じデザイン\nlet bdN=0;\nfunction badge(ch){\n  const id='cpb'+(bdN++);\n  let l='';\n  for(let i=0;i\u003c72;i++){const a=i*Math.PI/36;l+=`\u003cline x1=\"0\" y1=\"0\" x2=\"${(Math.cos(a)*140).toFixed(2)}\" y2=\"${(Math.sin(a)*140).toFixed(2)}\"/>`}\n  const k=[[-62,-62,1,1],[62,-62,-1,1],[-62,62,1,-1],[62,62,-1,-1]].map(c=>`\u003cpolyline points=\"${c[0]+c[2]*22},${c[1]} ${c[0]},${c[1]} ${c[0]},${c[1]+c[3]*22}\"/>`).join('');\n  return `\u003csvg class=\"bd\" viewBox=\"-100 -100 200 200\" aria-hidden=\"true\">\u003cdefs>\u003cclipPath id=\"${id}\">\u003cpolygon points=\"0,-94 94,0 0,94 -94,0\"/>\u003c/clipPath>\u003c/defs>`+\n    `\u003cg clip-path=\"url(#${id})\" stroke=\"#fff\" stroke-width=\"2.7\">${l}\u003c/g>`+\n    `\u003ctext x=\"0\" y=\"42\" text-anchor=\"middle\" font-size=\"118\" font-weight=\"700\" fill=\"#000\" stroke=\"#000\" stroke-width=\"2.5\" stroke-linejoin=\"round\" font-family=\"Roboto Condensed,Arial Narrow,Arial,sans-serif\">${ch}\u003c/text>`+\n    `\u003cg stroke=\"#fff\" stroke-width=\"1.8\" fill=\"none\">${k}\u003c/g>\u003c/svg>`;\n}\n$('bgG').innerHTML=badge('G');$('bgH').innerHTML=badge('H');\n\nconst scr=k=>{['start','game','end'].forEach(i=>$(i).classList.toggle('on',i===k));buildFrames()};\naddEventListener('resize',buildFrames);\n\n/* ---------- 問題生成 ---------- */\n// ランダムな自己回避ウォーク（必ずクリア可能）\nfunction gen(R,C,n){\n  const D=[[1,0],[-1,0],[0,1],[0,-1]];\n  for(let t=0;t\u003c400;t++){\n    let r=Math.floor(Math.random()*R),c=Math.floor(Math.random()*C),p=[[r,c]],seen=new Set([r*C+c]);\n    while(p.length\u003cn){\n      const [y,x]=p[p.length-1],o=D.map(d=>[y+d[0],x+d[1]]).filter(([a,b])=>a>=0&&b>=0&&a\u003cR&&b\u003cC&&!seen.has(a*C+b));\n      if(!o.length)break;\n      // 曲がりを優先して複雑に\n      const pr=p.length>1?[y-p[p.length-2][0],x-p[p.length-2][1]]:null;\n      const bend=o.filter(([a,b])=>!pr||(a-y)!==pr[0]||(b-x)!==pr[1]);\n      const pick=(bend.length&&Math.random()\u003c.65?bend:o);\n      const q=pick[Math.floor(Math.random()*pick.length)];\n      p.push(q);seen.add(q[0]*C+q[1]);\n    }\n    if(p.length===n)return p;\n  }\n  return null;\n}\nfunction load(keep){\n  const [R,C,n]=LV[step-1];let p;\n  if(keep)p=path;else while(!(p=gen(R,C,n)));\n  path=p;const b=$('board');b.innerHTML='';\n  const sz=Math.max(24,Math.min(Math.floor(innerWidth*.85/(C+.92)),Math.floor(innerHeight*.5/(R+.92)),56));\n  const f=sz/BU;\n  b.style.setProperty('--sz',sz+'px');\n  b.style.setProperty('--bw',Math.max(1.5,sz*.045)+'px');\n  b.style.gridTemplateColumns=`repeat(${C},${sz}px)`;b.style.gridAutoRows=sz+'px';\n  const fb=frameBoard(C,R),w=$('wrap'),bf=$('bf');\n  w.style.padding=(BM*f)+'px';\n  bf.setAttribute('width',fb.vbW*f);bf.setAttribute('height',fb.vbH*f);bf.setAttribute('viewBox',`0 0 ${fb.vbW} ${fb.vbH}`);\n  bf.setAttribute('fill','none');bf.setAttribute('stroke',LN);bf.setAttribute('stroke-width','3');\n  bf.innerHTML=fb.svg;\n  $('great').style.inset=((BM-.5)*f)+'px';\n  cells={};const inP=new Set(p.map(([a,b])=>a*C+b));\n  for(let r=0;r\u003cR;r++)for(let c=0;c\u003cC;c++){\n    const d=document.createElement('div');d.className='c'+(inP.has(r*C+c)?'':' e');d.dataset.k=r*C+c;b.appendChild(d);cells[r*C+c]=d;\n  }\n  cur={R,C};total=n;\n  head=p[0][0]*C+p[0][1];\n  cells[head].classList.add('s');\n  vis=[head];paint();\n  $('st').textContent=step;lock=false;drawing=false;last=null;\n}\n\n/* ---------- なぞり表示 ---------- */\nfunction paint(){\n  for(const k in cells){\n    const el=cells[k];\n    if(el.classList.contains('v')){el.classList.remove('v','h');el.removeAttribute('style')}\n  }\n  const C=cur.C;\n  vis.forEach((k,i)=>{\n    const el=cells[k],nb=[vis[i-1],vis[i+1]];\n    el.classList.add('v');if(k===head)el.classList.add('h');\n    const conn=d=>nb.includes(k+d)?0:1;   // 1=縁あり, 0=つながっている\n    el.style.setProperty('--t',conn(-C));\n    el.style.setProperty('--r',conn(1));\n    el.style.setProperty('--b',conn(C));\n    el.style.setProperty('--l',conn(-1));\n  });\n}\nconst adj=(a,b)=>Math.abs(Math.floor(a/cur.C)-Math.floor(b/cur.C))+Math.abs(a%cur.C-b%cur.C)===1;\nfunction enter(k){\n  const el=cells[k];if(!el||el.classList.contains('e')||lock)return;\n  if(k===head)return;\n  // 1つ前に戻ると取り消し\n  if(vis.length>1&&k===vis[vis.length-2]){vis.pop();head=k;paint();return}\n  if(vis.includes(k)||!adj(head,k))return;\n  vis.push(k);head=k;paint();\n  if(vis.length===total)clear();\n}\nfunction clear(){\n  lock=true;drawing=false;last=null;score+=20;$('sc').textContent=String(score).padStart(3,'0');\n  $('great').classList.add('on');\n  setTimeout(()=>{$('great').classList.remove('on');\n    if(step>=5)finish(true);else{step++;load()}},1100);\n}\n\n/* ---------- 入力（なぞり） ---------- */\nfunction at(x,y){const e=document.elementFromPoint(x,y);return e&&e.dataset&&e.dataset.k!==undefined?+e.dataset.k:null}\nfunction move(x,y){\n  if(!drawing||!last||lock)return;\n  const [lx,ly]=last,dx=x-lx,dy=y-ly,m=Math.max(1,Math.ceil(Math.hypot(dx,dy)/8));\n  for(let i=1;i\u003c=m;i++){\n    const k=at(lx+dx*i/m,ly+dy*i/m);if(k!==null)enter(k);\n    if(lock||!drawing)return;   // クリアした時点で中断\n  }\n  last=[x,y];\n}\nfunction release(){\n  // 指を離したらスタート位置に戻る\n  if(drawing&&!lock&&running){head=vis[0];vis=[head];paint()}\n  drawing=false;last=null;\n}\n$('game').addEventListener('pointerdown',e=>{\n  if(e.target.closest&&e.target.closest('button'))return;\n  e.preventDefault();\n  if(lock||!running)return;\n  const k=at(e.clientX,e.clientY);\n  if(k!==null&&k===vis[0]){drawing=true;last=[e.clientX,e.clientY]}\n});\naddEventListener('pointermove',e=>move(e.clientX,e.clientY));\naddEventListener('pointerup',release);addEventListener('pointercancel',release);\n\n/* ---------- 進行 ---------- */\nfunction tick(now){\n  if(!running)return;\n  if(!lock){tLeft-=(now-tLast)/1000}\n  tLast=now;\n  if(tLeft\u003c=0){tLeft=0;$('tm').textContent='0.00';return finish(false)}\n  $('tm').textContent=tLeft.toFixed(2);\n  rafId=requestAnimationFrame(tick);\n}\nlet hintT=0;\nfunction showHint(){const h=document.querySelector('.hint');h.classList.remove('fo');clearTimeout(hintT);hintT=setTimeout(()=>h.classList.add('fo'),3000)}\nfunction begin(){\n  clearInterval(cdT);showHint();step=1;score=0;tLeft=120;$('sc').textContent='000';\n  $('great').classList.remove('on');\n  scr('game');load();running=true;tLast=performance.now();rafId=requestAnimationFrame(tick);\n}\nfunction finish(ok){\n  running=false;drawing=false;cancelAnimationFrame(rafId);\n  $('es').textContent=score;\n  $('em').textContent=ok?'COMPLETE':'TIME UP';\n  endReady=performance.now()+700;$('vs').style.display=ok?'none':'flex';\n  scr('end');\n}\nfunction startCd(){n=10;$('cd').textContent=n;scr('start');clearInterval(cdT);\n  cdT=setInterval(()=>{n--;$('cd').textContent=n;if(n\u003c=0)begin()},1000)}\n$('go').onclick=begin;\nfunction showSol(){\n  scr('game');load(true);lock=true;running=false;\n  vis=path.map(([r,c])=>r*cur.C+c);head=vis[vis.length-1];paint();\n  path.forEach(([r,c],i)=>{if(!i)return;const s=document.createElement('span');s.className='nm';s.textCon ol=TPOOL[key]||(TPOOL[key]=[]);\n if(pool.length\u003c14){for(let k=0;k\u003c300;k++){const r=tile(W,H);if(!r)continue;const c=Array(ORI.length).fill(0);r.res.forEach(cs=>c[TYP.get(norm(cs).join(';'))]++);const n=r.res.length;if(Math.min(...c)>=Math.floor(n/ORI.length)&&Math.max(...c)\u003c=Math.ceil(n/ORI.length)){pool.push(r);break}}}\n return pool.length?pool[Math.random()*pool.length|0]:tile(W,H)}\nlet ST=0,W,H,HOLE,OWN,HD,P=[],S,OX,t0,tl=120,score=0,ph='rule',msg='',rt0=Date.now(),drag;\nconst bb=p=>[Math.max(...p.c.map(a=>a[0]))+1,Math.max(...p.c.map(a=>a[1]))+1];\nfunction home(p){const[w,h]=bb(p);p.x=p.hx-w/2;p.y=p.hy-h/2;p.placed=false}\nfunction comps(){\n const seen=new Set();let n=0;\n for(let y=0;y\u003cH;y++)for(let x=0;x\u003cW;x++)if(HOLE[y][x]&&!seen.has(x+','+y)){\n  n++;const st=[[x,y]];seen.add(x+','+y);\n  while(st.length){const[a,b]=st.pop();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=a+dx,Y=b+dy,k=X+','+Y;if(X>=0&&Y>=0&&X\u003cW&&Y\u003cH&&HOLE[Y][X]&&!seen.has(k)){seen.add(k);st.push([X,Y])}}}}\n return n;\n}\nfunction maxComp(){const seen=new Set();let m=0;for(let y=0;y\u003cH;y++)for(let x=0;x\u003cW;x++)if(HOLE[y][x]&&!seen.has(x+','+y)){let n=0;const st=[[x,y]];seen.add(x+','+y);while(st.length){const[a,b]=st.pop();n++;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=a+dx,Y=b+dy,k=X+','+Y;if(X>=0&&Y>=0&&X\u003cW&&Y\u003cH&&HOLE[Y][X]&&!seen.has(k)){seen.add(k);st.push([X,Y])}}}m=Math.max(m,n/4)}return m}\n/* 穴(つながった領域)に、その穴のピース一式を入れる方法が何通りあるか数える(cap以上は打ち切り) */\nfunction countTil(cellSet,typeCnt,cap){\n const occ=new Set(cellSet),cs=[...cellSet].map(k=>k.split(',').map(Number)).sort((a,b)=>a[1]-b[1]||a[0]-b[0]);let n=0;\n (function go(){\n  if(n>=cap)return;\n  const f=cs.find(c=>occ.has(c[0]+','+c[1]));\n  if(!f){n++;return}\n  for(let t=0;t\u003cORI.length;t++)if(typeCnt[t]>0)for(const o of ORI[t]){\n   const sh=o.map(([a,b])=>[a-o[0][0]+f[0],b-o[0][1]+f[1]]);\n   if(sh.every(([x,y])=>occ.has(x+','+y))){sh.forEach(([x,y])=>occ.delete(x+','+y));typeCnt[t]--;go();typeCnt[t]++;sh.forEach(([x,y])=>occ.add(x+','+y));if(n>=cap)return}\n  }\n })();\n return n}\nconst BIGMAX=6;/* 4ピース以上の穴: 最大6ピース */\n/* 4ピース以上の穴は「周りのブロックで形が絞られる」ものだけ: 盤面の外枠に接する割合が低く、\n   ピースを置ける位置が少なく、正解が1通りに決まること。長方形に近い開けた穴は不可 */\nfunction holesOK(cells,ids,small){\n const own=new Map();\n ids.forEach(i=>cells[i].forEach(([x,y])=>own.set(x+','+y,i)));\n const seen=new Set(),D=[[1,0],[-1,0],[0,1],[0,-1]];\n for(const k of own.keys()){if(seen.has(k))continue;\n  const comp=new Set(),pcs=new Set(),st=[k];seen.add(k);\n  while(st.length){const c=st.pop();comp.add(c);pcs.add(own.get(c));const[a,b]=c.split(',').map(Number);\n   for(const[dx,dy]of D){const kk=(a+dx)+','+(b+dy);if(own.has(kk)&&!seen.has(kk)){seen.add(kk);st.push(kk)}}}\n  if(pcs.size>[4,3,4,BIGMAX,BIGMAX][ST])return false;/* 1〜3問目は穴を小さめに */\n  if(small&&pcs.size>3)return false;\n  if(pcs.size>=4){\n   let wall=0,fixed=0,pl=0;\n   comp.forEach(c=>{const[a,b]=c.split(',').map(Number);\n    for(const[dx,dy]of D){const X=a+dx,Y=b+dy;if(X\u003c0||Y\u003c0||X>=W||Y>=H)wall++;else if(!HOLE[Y][X])fixed++}\n    for(const os of ORI)for(const o of os){if(o.every(([p,q])=>comp.has((p-o[0][0]+a)+','+(q-o[0][1]+b))))pl++}});\n   if(wall/(wall+fixed)>.45||pl/comp.size>3.8)return false;\n   const tc=Array(ORI.length).fill(0);pcs.forEach(i=>tc[TYP.get(norm(cells[i]).join(';'))]++);\n   if(countTil(comp,tc,2)>1)return false}}\n return true}\nfunction pack(list,x0,x1,a,pitch){a=a===undefined?1.4:a;pitch=pitch||2.6;/* 横長: ピースの幅に合わせて左から並べ、入りきらなければ次の段へ(重ならない) */\n const rows=[];let cur=[],w=0;\n for(const q of list){const pw=bb(q)[0];if(cur.length&&w+.6+pw>x1-x0){rows.push(cur);cur=[];w=0}w+=(cur.length?.6:0)+pw;cur.push(q)}\n if(cur.length)rows.push(cur);\n rows.forEach((r,i)=>{const tw=r.reduce((a,q)=>a+bb(q)[0],0)+.6*(r.length-1);let x=(x0+x1)/2-tw/2;\n  r.forEach(q=>{const pw=bb(q)[0];q.hx=x+pw/2;q.hy=OY+H+a+(i+.5)*pitch;x+=pw+.6})})}\nfunction setHomes(){\n if(rotOn()){/* 横画面: 盤面の下に、左右の穴ごとに2段までで並べる(段の間隔を詰める) */\n  if(P.some(q=>q.side!==undefined)){pack(P.filter(q=>q.side===0),1.6,LW/2-.3,.9,2.2);pack(P.filter(q=>q.side===1),LW/2+.3,LW-1.6,.9,2.2)}else pack(P,1.6,LW-1.6,.9,2.2);return}\n if(LW>22){if(P.some(q=>q.side!==undefined)){pack(P.filter(q=>q.side===0),2,LW/2-.3);pack(P.filter(q=>q.side===1),LW/2+.3,LW-2)}else pack(P,2,LW-2);return}\nconst cols=LW>22?6:4,hc=cols/2;\n if(P.some(p=>p.side!==undefined)){/* 左半分の穴のピースは左側、右半分の穴のピースは右側に置く */\n  [0,1].forEach(sd=>P.filter(p=>p.side===sd).forEach((p,k)=>{p.hx=2+(sd*hc+k%hc+.5)*(LW-4)/cols;p.hy=OY+H+1.4+(Math.floor(k/hc)+.5)*2.6}))}\n else P.forEach(p=>{p.hx=2+(p.n%cols+.5)*(LW-4)/cols;p.hy=OY+H+1.4+(Math.floor(p.n/cols)+.5)*2.6})}\nfunction gen(){\n const c=Object.assign({},GEO[ST],{halves:ST===EASY?[{k:ST===1?3:4,m:'ez'},{k:ST===1?3:4,m:'ez'}]:PAT.s[ST]}),half=c.rep?c.w/2:c.w;W=c.w;H=c.h;let tries=0;\n for(;;){\n  if(tries%60==59)LAY=null;/* 条件に合う穴が作れない配置なら、タイル配置ごと作り直す */\n  const r=(c.rep&&PAT.same&&LAY)||tileBal(half,H);if(!r)continue;if(c.rep)LAY=r;tries++;\n  let cells=r.res;const n0=cells.length;\n  if(c.rep)cells=cells.concat(cells.map(a=>a.map(([x,y])=>[x+half,y])));\n  const adj=Array.from({length:n0},()=>new Set());\n  for(let y=0;y\u003cH;y++)for(let x=0;x\u003chalf;x++)for(const[dx,dy]of[[1,0],[0,1]]){\n   const X=x+dx,Y=y+dy;if(X\u003chalf&&Y\u003cH&&r.g[Y][X]!==r.g[y][x]){adj[r.g[y][x]].add(r.g[Y][X]);adj[r.g[Y][X]].add(r.g[y][x])}}\n  const idx=[...Array(n0).keys()];\n  const pickSet=(hv,g)=>{\n   const pick=new Set();g=shuf(g);\n   if(hv.m=='iso'){for(const i of g)if(pick.size\u003chv.k&&![...adj[i]].some(j=>pick.has(j)))pick.add(i)}\n   else if(hv.m=='rand'){g.slice(0,hv.k).forEach(i=>pick.add(i))}\n   else if(hv.m=='multi'){const opts=Math.random()\u003c(tries\u003c500?hv.big||0:0)?[[4,1],[4,1],[5]]:[[3,2],[2,3],[2,2,1],[3,1,1],[2,1,2],[1,2,2],[3,2],[2,2,1]],parts=opts[Math.random()*opts.length|0];for(const n of parts){const pool=g.filter(i=>!pick.has(i)&&![...adj[i]].some(j=>pick.has(j))),part=new Set();if(!pool.length)break;part.add(pool[0]);while(part.size\u003cn){const fr=[...part].flatMap(i=>[...adj[i]]).filter(j=>pool.includes(j)&&!part.has(j));if(!fr.length)break;part.add(fr[Math.random()*fr.length|0])}if(part.size\u003cn)break;part.forEach(i=>pick.add(i))}}\n   else if(hv.m=='ez'){/* 簡単な問題でも、2〜3ピースが隣り合う穴を必ず1つ入れる(残りは単独の穴) */const opts=hv.k==3?[[2,1]]:[[2,1,1],[3,1],[2,2]],parts=opts[Math.random()*opts.length|0];for(const n of parts){const pool=g.filter(i=>!pick.has(i)&&![...adj[i]].some(j=>pick.has(j))),part=new Set();if(!pool.length)break;part.add(pool[0]);while(part.size\u003cn){const fr=[...part].flatMap(i=>[...adj[i]]).filter(j=>pool.includes(j)&&!part.has(j));if(!fr.length)break;part.add(fr[Math.random()*fr.length|0])}if(part.size\u003cn)break;part.forEach(i=>pick.add(i))}}\n   else if(hv.m=='blob'){for(const n of hv.parts){const pool=g.filter(i=>!pick.has(i)),part=new Set();if(!pool.length)break;part.add(pool[0]);while(part.size\u003cn){const fr=[...part].flatMap(i=>[...adj[i]]).filter(j=>pool.includes(j)&&!part.has(j));if(!fr.length)break;part.add(fr[Math.random()*fr.length|0])}if(part.size\u003cn)break;part.forEach(i=>pick.add(i))}}\n   else if(g.length){pick.add(g[0]);while(pick.size\u003chv.k){const fr=[...pick].flatMap(i=>[...adj[i]]).filter(j=>g.includes(j)&&!pick.has(j));if(!fr.length)break;pick.add(fr[Math.random()*fr.length|0])}}\n   return pick.size==hv.k?pick:null};\n  /* rep: 左右は同じタイル配置。穴にするタイルだけ左右で変える(なるべく重ならないように) */\n  const sets=[];let good=true;\n  for(const hv of c.halves){\n   const used=new Set(sets.flatMap(s=>[...s])),s=pickSet(hv,tries\u003c40?idx.filter(i=>!used.has(i)):idx);\n   if(!s){good=false;break}sets.push(s)}\n  if(!good)continue;\n  if(sets.length==2&&[...sets[0]].every(i=>sets[1].has(i)))continue;\n  if(sets.length==2&&tries\u003c400&&[...sets[0]].filter(i=>sets[1].has(i)).length>Math.ceil(.6*sets[0].size))continue;\n  const ids=[...sets[0]];if(c.rep)ids.push(...[...sets[1]].map(i=>i+n0));\n   const src=GAMES[id].replace(/env\(safe-area-inset-(top|right|bottom|left)\s*,\s*0px\)/g,(m,k)=>ins[k]+'px');
  frame=document.createElement('iframe');
  frame.title=TITLES[id];
  frame.setAttribute('allow','fullscreen');
  frame.srcdoc=src;
  frame.addEventListener('load',()=>{try{frame&&frame.focus()}catch(e){}});
  game.appendChild(frame);
  game.classList.add('on');game.setAttribute('aria-hidden','false');
  menu.style.visibility='hidden';
  try{history.pushState({g:id},'');pushed=true}catch(e){pushed=false}
}
function closeGame(){
  if(!frame)return;
  frame.remove();frame=null;           /* iframeごと消すので、ゲーム内のタイマー等も止まる */
  game.classList.remove('on');game.setAttribute('aria-hidden','true');
  menu.style.visibility='';
  fit();
}
document.querySelectorAll('.row').forEach(b=>b.addEventListener('click',()=>openGame(b.dataset.g)));
function goHome(){closeGame();if(pushed){pushed=false;try{history.back()}catch(e){}}}
addEventListener('message',e=>{if(frame&&e.source===frame.contentWindow&&e.data&&e.data.home)goHome()});
addEventListener('popstate',()=>{pushed=false;closeGame()});
</script>
</body>
</html>
